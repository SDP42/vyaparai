name: Feature / phase task
description: A scoped piece of work from docs/PHASES.md
labels: [feature]
body:
  - type: input
    id: phase
    attributes: { label: Phase, placeholder: "Phase 1 · ingestion" }
    validations: { required: true }
  - type: textarea
    id: story
    attributes: { label: User story, placeholder: "As a store owner, I want … so that …" }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, placeholder: "- [ ] …" }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Notes / assumptions }
