[project]
name = "vyapar-api"
version = "0.1.0"
description = "Vyapar AI backend: FastAPI modular monolith for retail business intelligence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2",
    "openpyxl>=3.1",
    "numpy>=2.5.4",
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # B008: Depends() is idiomatic; RUF00x: ₹ × ÷ are intentional in user-facing text

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr", "declared_attr"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Research scripts (not product code): long table lines, pickled local results, seeded random.
"app/services/campaigns.py" = ["E501"]
"app/services/digest.py" = ["E501"]
"app/services/costs.py" = ["E501"]
"app/services/inventory.py" = ["E501"]
"app/api/v1/endpoints/inventory.py" = ["E501"]
"app/api/v1/endpoints/alerts.py" = ["E501"]
"app/api/v1/endpoints/forecasts.py" = ["E501"]
"app/services/digest_delivery.py" = ["E501"]
"app/api/v1/endpoints/digests.py" = ["E501"]
"app/api/v1/endpoints/campaigns.py" = ["E501"]  # message templates and the segment table read best on one line
"experiments/**" = ["E501", "N803", "N806", "S301", "S311", "RUF059", "I001", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*"]
ignore_missing_imports = true
