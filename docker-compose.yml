# Production-shaped stack on one machine: PostgreSQL, Redis, the API and the web app.
# 1) cp .env.production.example .env   2) fill in the secrets   3) docker compose up -d --build
# Put a TLS-terminating proxy (Caddy, nginx, a cloud load balancer) in front of ports 3000 and 8000.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyapar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vyapar
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapar"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+pg8000://vyapar:${POSTGRES_PASSWORD}@db:5432/vyapar
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      CORS_ORIGINS: '["${PUBLIC_URL:?set PUBLIC_URL}"]'
      APP_URL: ${PUBLIC_URL}
      TRUST_PROXY: "true"
      LOG_JSON: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes: [storage:/data/storage, models:/data/models]
    ports: ["8000:8000"]
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  dbdata:
  storage:
  models:
